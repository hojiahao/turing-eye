[workspace]
members = ["crates/service"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync", "net", "signal"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
